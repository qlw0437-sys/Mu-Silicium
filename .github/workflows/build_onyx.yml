name: Build onyx UEFI
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y mono-devel build-essential lld uuid-dev nasm gcc-aarch64-linux-gnu python3 python3-git python3-pip gettext locales gnupg ca-certificates python3-venv git git-core clang llvm curl lld dosfstools mtools
          pip install --ignore-installed --break-system-packages -r pip-requirements.txt
          echo "CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Patch BootManager to Auto-Launch Menu on No-OS
        run: |
          python3 -c '
          path = "Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/BootManager.c"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          target = "gRT->ResetSystem (EfiResetShutdown, EFI_SUCCESS, 0, NULL);"
          replacement = """EFI_BOOT_MANAGER_LOAD_OPTION LoadOption;
            if (!EFI_ERROR (MsBootOptionsLibGetBootManagerMenu (&LoadOption, NULL))) {
              EfiBootManagerBoot (&LoadOption);
              EfiBootManagerFreeLoadOption (&LoadOption);
            }
            gRT->ResetSystem (EfiResetShutdown, EFI_SUCCESS, 0, NULL);"""

          if target in code:
              code = code.replace(target, replacement, 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(code)
              print("Successfully patched BootManager.c!")
          else:
              print("Target string not found in BootManager.c")
          '

      - name: Prepare UEFI Shell Payload Ramdisk
        run: |
          curl -sL https://github.com/pbatard/UEFI-Shell/releases/download/26H2/shellaa64.efi -o shellaa64.efi
          truncate -s 16M payload.img
          mkfs.vfat -F 16 -n "ONYXESP" payload.img
          mmd -i payload.img ::EFI
          mmd -i payload.img ::EFI/BOOT
          mmd -i payload.img ::EFI/UniXNU
          mcopy -i payload.img shellaa64.efi ::EFI/BOOT/BOOTAA64.EFI
          cat << 'EOF' > startup.nsh
          @echo -off
          echo ========================================================
          echo   Redmi Turbo 4 Pro (onyx) UEFI Shell Active!
          echo ========================================================
          EOF
          mcopy -i payload.img startup.nsh ::startup.nsh
          cp payload.img Resources/ramdisk

      - name: Build onyx UEFI
        run: |
          python3 ./build_uefi.py -d onyx -r DEBUG -c
          python3 ./build_uefi.py -d onyx -r RELEASE -c

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mu-onyx-build
          path: |
            Mu-onyx*
            Build/onyxPkg/*/FV/SILICIUM_UEFI.fd
