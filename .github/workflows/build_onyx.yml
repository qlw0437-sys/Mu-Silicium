name: Build onyx UEFI
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y mono-devel build-essential lld uuid-dev nasm gcc-aarch64-linux-gnu python3 python3-git python3-pip gettext locales gnupg ca-certificates python3-venv git git-core clang llvm curl lld dosfstools mtools
          pip install --ignore-installed --break-system-packages -r pip-requirements.txt
          echo "CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Fetch and Integrate UniXNU
        run: |
          # 1. Clone UniXNU
          git clone --depth 1 https://github.com/UniXNU/UniXNU.git /tmp/unixnu_repo
          cp -r /tmp/unixnu_repo/package/UniXNUPkg ./UniXNUPkg
          cp -r /tmp/unixnu_repo/package/UniXNUPkg ./Silicon/Silicium/UniXNUPkg

          # 2. Patch UniXNU Config.c to set Redmi Turbo 4 Pro builtin menu
          python3 -c '
          for p in ["UniXNUPkg/Library/UniXNULib/Config.c", "Silicon/Silicium/UniXNUPkg/Library/UniXNULib/Config.c"]:
              with open(p, "r", encoding="utf-8") as f:
                  code = f.read()
              old = code[code.find("STATIC CONST CHAR8  mBuiltinConfig[]"):code.find("STATIC\nVOID\nConfigError")]
              new = """STATIC CONST CHAR8  mBuiltinConfig[] =
                "version = 1\\n"
                "[boot]\\n"
                "timeout = 10\\n"
                "rotate = 0\\n"
                "[ui]\\n"
                "title = \\"UniXNU - Redmi Turbo 4 Pro\\"\\n"
                "[[entry]]\\n"
                "id = \\"xnu\\"\\n"
                "title = \\"Darwin / XNU (SM8735)\\"\\n"
                "type = \\"action\\"\\n"
                "action = \\"exit\\"\\n"
                "[[entry]]\\n"
                "id = \\"fw\\"\\n"
                "title = \\"Return to UEFI Firmware\\"\\n"
                "type = \\"action\\"\\n"
                "action = \\"exit\\"\\n"
                "[[entry]]\\n"
                "id = \\"reset\\"\\n"
                "title = \\"Restart System\\"\\n"
                "type = \\"action\\"\\n"
                "action = \\"reset\\"\\n"
                "[[entry]]\\n"
                "id = \\"shutdown\\"\\n"
                "title = \\"Power Off\\"\\n"
                "type = \\"action\\"\\n"
                "action = \\"shutdown\\"\\n";

              """
              code = code.replace(old, new, 1)
              with open(p, "w", encoding="utf-8") as f:
                  f.write(code)
          print("Updated UniXNULib Config.c with onyx builtin menu!")
          '

          # 3. Add UniXNULib & UniXNU.inf to onyx.dsc
          python3 -c '
          path = "Platforms/Xiaomi/onyxPkg/onyx.dsc"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()
          code = code.replace("[LibraryClasses]", "[LibraryClasses]\n  UniXNULib|UniXNUPkg/Library/UniXNULib/UniXNULib.inf", 1)
          code = code.replace("[Components]", "[Components]\n  UniXNUPkg/Application/UniXNU/UniXNU.inf", 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("Patched onyx.dsc with UniXNU components!")
          '

          # 4. Add UniXNU.inf to onyx.fdf in valid position
          python3 -c '
          path = "Platforms/Xiaomi/onyxPkg/onyx.fdf"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()
          target = "INF SiliciumPkg/Drivers/RamManagerDxe/RamManagerDxe.inf"
          replacement = "INF SiliciumPkg/Drivers/RamManagerDxe/RamManagerDxe.inf\n  INF UniXNUPkg/Application/UniXNU/UniXNU.inf"
          code = code.replace(target, replacement, 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("Patched onyx.fdf with UniXNU.inf!")
          '

          # 5. Add MsBootOptionsLibGetUniXNU to MsBootOptionsLib.c
          python3 -c '
          path = "Silicon/Silicium/SiliciumPkg/Library/MsBootOptionsLib/MsBootOptionsLib.c"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()
          func = """
          EFI_STATUS
          EFIAPI
          MsBootOptionsLibGetUniXNU (
            IN OUT EFI_BOOT_MANAGER_LOAD_OPTION *LoadOption,
            IN     CHAR8                        *Parameter)
          {
            STATIC EFI_GUID UniXNUFile = { 0x9B665204, 0xA133, 0x47A2, { 0x93, 0x96, 0x9E, 0x2B, 0x37, 0x0A, 0x4E, 0x25 } };
            return BuildFwLoadOption (LoadOption, &UniXNUFile, Parameter);
          }
          """
          code += func
          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("Added MsBootOptionsLibGetUniXNU to MsBootOptionsLib.c!")
          '

          # 6. Add UniXNU to PlatformBootOptions.c
          python3 -c '
          path = "Silicon/Qualcomm/QcomPkg/Library/PlatformBootOptionsLib/PlatformBootOptions.c"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()
          old = "LocalBootOption = AllocateZeroPool (sizeof (EFI_PLATFORM_BOOT_OPTION));"
          new = """STATIC EFI_GUID gUniXNUAppGuid = { 0x9B665204, 0xA133, 0x47A2, { 0x93, 0x96, 0x9E, 0x2B, 0x37, 0x0A, 0x4E, 0x25 } };
            LocalBootOption = AllocateZeroPool (2 * sizeof (EFI_PLATFORM_BOOT_OPTION));"""
          code = code.replace(old, new, 1)

          old2 = """  // Add Mass Storage Boot Option
            LocalBootOption[0].AppName       = L"Mass Storage";
            LocalBootOption[0].AppGuid       = FixedPcdGetPtr (PcdMassStorageFile);
            LocalBootOption[0].LoadAttribute = LOAD_OPTION_HIDDEN;

            // Set Boot Option Count
            LocalBootOptionCount = 1;"""

          new2 = """  // Add UniXNU Boot Option
            LocalBootOption[0].AppName       = L"UniXNU (DarwinBoot)";
            LocalBootOption[0].AppGuid       = &gUniXNUAppGuid;
            LocalBootOption[0].LoadAttribute = LOAD_OPTION_ACTIVE;

            // Add Mass Storage Boot Option
            LocalBootOption[1].AppName       = L"Mass Storage";
            LocalBootOption[1].AppGuid       = FixedPcdGetPtr (PcdMassStorageFile);
            LocalBootOption[1].LoadAttribute = LOAD_OPTION_HIDDEN;

            // Set Boot Option Count
            LocalBootOptionCount = 2;"""

          code = code.replace(old2, new2, 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("Added UniXNU to PlatformBootOptions.c!")
          '

          # 7. Patch BootManager.c to auto-boot UniXNU
          python3 -c '
          path = "Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/BootManager.c"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          target = "gRT->ResetSystem (EfiResetShutdown, EFI_SUCCESS, 0, NULL);"
          replacement = """EFI_STATUS EFIAPI MsBootOptionsLibGetUniXNU (IN OUT EFI_BOOT_MANAGER_LOAD_OPTION *LoadOption, IN CHAR8 *Parameter);
            EFI_BOOT_MANAGER_LOAD_OPTION UniXNUOption;
            if (!EFI_ERROR (MsBootOptionsLibGetUniXNU (&UniXNUOption, NULL))) {
              EfiBootManagerBoot (&UniXNUOption);
              EfiBootManagerFreeLoadOption (&UniXNUOption);
            }
            EFI_BOOT_MANAGER_LOAD_OPTION MenuOption;
            if (!EFI_ERROR (MsBootOptionsLibGetBootManagerMenu (&MenuOption, NULL))) {
              EfiBootManagerBoot (&MenuOption);
              EfiBootManagerFreeLoadOption (&MenuOption);
            }
            gRT->ResetSystem (EfiResetShutdown, EFI_SUCCESS, 0, NULL);"""

          code = code.replace(target, replacement, 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("Patched BootManager.c to auto-launch UniXNU!")
          '

      - name: Build onyx UEFI
        run: |
          python3 ./build_uefi.py -d onyx -r RELEASE -c

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mu-onyx-build
          path: |
            Mu-onyx*
            Build/onyxPkg/*/FV/SILICIUM_UEFI.fd
